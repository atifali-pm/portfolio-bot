name = "portfolio-bot"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding (free tier covers Llama 3 + bge embeddings).
[ai]
binding = "AI"

# Vectorize binding for retrieved-chunk index.
# Index dimensions and metric must match the embedding model:
# @cf/baai/bge-base-en-v1.5 emits 768-dim cosine vectors.
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "portfolio-bot"

[observability]
enabled = true

# INGEST_SECRET protects /admin/ingest and /admin/query in Phase 1.
# Production: managed via `wrangler secret put INGEST_SECRET` (already set).
# Local dev: write to .dev.vars (gitignored).
# Note: secret types are NOT declared in wrangler.toml, only their presence
# in the runtime types is. Re-run `wrangler types` after adding new secrets.

# Per-route CORS allowlist for the chat widget will be added in Phase 5
# when the Worker is wired to atifali.pages.dev.
